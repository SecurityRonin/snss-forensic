keywords     = ["forensics", "chromium", "snss", "dfir", "browser"]
categories   = ["parser-implementations"]

[lib]
name = "snss_forensic"
path = "src/lib.rs"

[dependencies]
snss           = { workspace = true }
forensicnomicon = { workspace = true }

[lints]
workspace = true
