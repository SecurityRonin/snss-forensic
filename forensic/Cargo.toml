[package]
name         = "snss-forensic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description  = "Chromium/Brave SNSS session-restore tamper analyzer — graded findings (navigation records that failed to decode, window last-active timestamps outside the range the format could have written) over the snss-core reader. Re-exports the full reader surface."
